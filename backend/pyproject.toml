[project]
name = "retrainix-backend"
version = "0.1.0"
description = "Retrainix API - FastAPI on Cloud Run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.35",
    "requests>=2.32",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F811"]  # long literal fixtures; fixtures imported from another test module
